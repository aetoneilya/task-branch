[package]
name = "worktable"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "wt"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5.41", features = ["derive"] }
reqwest = { version = "0.12", features = ["blocking", "json", "gzip"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
chrono = { version = "0.4", features = ["serde"] }
dialoguer = { version = "0.12.0", features = ["fuzzy-select"] }
thiserror = "2.0.16"
regex = "1.11.1"
clap_complete = "4"
dirs = "6.0.0"
toml = "0.9.5"
ratatui = "0.29.0"
crossterm = "0.28.1"
