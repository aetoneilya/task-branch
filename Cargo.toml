[package]
name = "jira-gitlab"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "jg"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5.41", features = ["derive"] }
reqwest = { version = "0.12", features = ["blocking", "json"] }
serde = { version = "1.0", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }
urlencoding = "2.1"
dotenv = "0.15"
dialoguer = { version = "0.12.0", features = ["fuzzy-select"] }
gitlab = "0.1802.0"
thiserror = "2.0.16"
regex = "1.11.1"
clap_complete = "4"
dirs = "6.0.0"
toml = "0.9.5"
